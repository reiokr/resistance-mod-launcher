[package]
name = "xcom2-launcher-core"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Native Linux core for XCOM 2 mod management (AML import prototype)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "aml-preview"
path = "src/bin/aml-preview.rs"
